apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

android {
    namespace = "com.focusflow.dayplanner"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.focusflow.dayplanner"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 17
        versionName "1.6.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        // Enable multidex for large dependency trees
        multiDexEnabled true
        aaptOptions {
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }

    signingConfigs {
        release {
            // Keys are read from gradle.properties (or from ~/.gradle/gradle.properties in CI).
            // Run once to create the keystore:
            //   keytool -genkey -v -keystore focusflow-release-key.keystore \
            //           -alias focusflow -keyalg RSA -keysize 2048 -validity 10000
            if (project.hasProperty('FOCUSFLOW_RELEASE_STORE_FILE')) {
                storeFile file(FOCUSFLOW_RELEASE_STORE_FILE)
                storePassword FOCUSFLOW_RELEASE_STORE_PASSWORD
                keyAlias FOCUSFLOW_RELEASE_KEY_ALIAS
                keyPassword FOCUSFLOW_RELEASE_KEY_PASSWORD
            }
        }
    }

    buildTypes {
        debug {
            debuggable true
            minifyEnabled false
            shrinkResources false
        }
        release {
            debuggable false
            minifyEnabled true
            shrinkResources true
            // Use the optimized rule set; our additions are in proguard-rules.pro
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (project.hasProperty('FOCUSFLOW_RELEASE_STORE_FILE')) {
                signingConfig signingConfigs.release
            }
        }
    }

    // R8 full mode: removes unused methods/fields more aggressively
    buildFeatures {
        buildConfig true
    }

    // AAB splits: smaller initial download per device
    bundle {
        language { enableSplit = true }
        density  { enableSplit = true }
        abi      { enableSplit = true }
    }

    // 64-bit support: required by Google Play since Aug 2019
    packagingOptions {
        jniLibs {
            useLegacyPackaging false
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
